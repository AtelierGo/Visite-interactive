# Construit les installateurs macOS (.dmg) et Windows (.exe) à chaque version (tag v*) ou à la demande.
name: Paquets
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  paquet:
    strategy:
      fail-fast: false        # un systeme qui echoue n'arrete pas l'autre
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: npm ci (3 essais, le telechargement d'Electron coupe parfois)
        shell: bash
        run: |
          for i in 1 2 3; do npm ci && exit 0; echo "essai $i rate, nouvel essai dans 30 s"; sleep 30; done; exit 1
      - run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: atelier-3d-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
